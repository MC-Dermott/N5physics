<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projectile Frames</title>
<style>
  :root{ --bg:#0c1420; --line:#24344a; --ink:#e7ecf5; --muted:#8a99b5; --amber:#ffb020; --teal:#2fd6c2; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{padding:12px 12px 16px;max-width:1100px;margin:0 auto;}
  .scenario{font-size:14px;line-height:1.45;background:#122036;border:1px solid var(--line);
    border-radius:6px;padding:10px 12px;margin-bottom:10px;}
  .scenario b{color:var(--amber);font-weight:600;}
  .frames{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .fbtn{font:inherit;font-size:13px;background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:8px 12px;border-radius:4px;cursor:pointer;text-align:left;}
  .fbtn:hover{color:var(--ink);border-color:#35506f;}
  .fbtn.active{background:var(--teal);border-color:var(--teal);color:#04211d;font-weight:600;}
  .frame-note{font-size:12.5px;color:var(--muted);margin:0 0 8px;min-height:18px;line-height:1.4;}
  .scope{background:#0a1626;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  canvas{display:block;width:100%;height:auto;}
  .transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line);}
  .tbtn{font:inherit;font-size:13px;background:var(--amber);color:#1a1200;border:none;padding:7px 14px;border-radius:4px;
    cursor:pointer;font-weight:600;}
  .tbtn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .scrub{flex:1;min-width:160px;accent-color:var(--amber);}
  .small{font-size:12px;color:var(--muted);}
  .jumps{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px;}
  .jbtn{font:inherit;font-size:12px;background:#122036;color:var(--ink);border:1px solid var(--line);border-radius:12px;
    padding:4px 10px;cursor:pointer;}
  .jbtn:hover{border-color:var(--amber);}
  .toggles{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted);}
  .toggles label{display:flex;gap:5px;align-items:center;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="scenario" id="scenario"></div>

  <div class="frames">
    <button class="fbtn active" data-frame="ground">Ground frame</button>
    <button class="fbtn" data-frame="horiz">Frame moving vertically with the projectile<br><small>→ horizontal motion only</small></button>
    <button class="fbtn" data-frame="vert">Frame moving horizontally with the projectile<br><small>↕ vertical motion only</small></button>
  </div>
  <p class="frame-note" id="frameNote"></p>

  <div class="scope">
    <canvas id="cv" width="960" height="520"></canvas>
    <div class="transport">
      <button class="tbtn" id="play">▶ Play</button>
      <button class="tbtn secondary" id="reset">↺ Reset</button>
      <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0">
      <select id="speed" class="tbtn secondary" style="padding:5px 6px;">
        <option value="0.25">0.25× speed</option><option value="0.5">0.5× speed</option>
        <option value="1" selected>1× speed</option><option value="2">2× speed</option>
      </select>
    </div>
    <div class="jumps" id="jumps"></div>
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="tStrobe" checked> equal-time marks</label>
    <label><input type="checkbox" id="tVec" checked> velocity arrows</label>
    <label><input type="checkbox" id="tPath" checked> full ground-frame path</label>
  </div>
</div>

<script>
(function(){
  // The app replaces the null below with this question's launch and scene.
  const INJECTED = /*__PROJECTILE_CONFIG__*/null;
  const C = Object.assign({
    v: 20, theta: 40, h: 0, launcher: "ground", landing: "ground",
    objects: [], marks: [], compare_theta: null,
    title: "A ball is kicked from flat ground at **20 m/s** at **40°** above the horizontal.",
  }, INJECTED || {});

  const G = 9.8;
  const rad = C.theta * Math.PI / 180;
  const VH = C.v * Math.cos(rad), VV0 = C.v * Math.sin(rad), H0 = C.h;
  const T_UP = VV0 / G;
  const H_TOP = H0 + VV0 * VV0 / (2 * G);
  const T_LAND = (VV0 + Math.sqrt(VV0 * VV0 + 2 * G * H0)) / G;
  const RANGE = VH * T_LAND;
  const LEVEL = C.landing === "sea" ? "the sea" : "the ground";
  const xAt = t => VH * t;
  const yAt = t => H0 + VV0 * t - 0.5 * G * t * t;
  const vvAt = t => VV0 - G * t;

  const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
  document.getElementById("scenario").innerHTML = esc(C.title || "").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const W = cv.width, PAD = 34;
  let H = cv.height;
  let frame = "ground", t = 0, playing = false, speed = 1, last = null;
  let showStrobe = true, showVec = true, showPath = true;

  // ── view box in metres (equal scale on both axes, so the path is not distorted) ──
  const objMaxH = Math.max(0, ...C.objects.map(o => o.height || o.reach || 1.8));
  const objMaxX = Math.max(0, ...C.objects.map(o => o.x || 0));
  const elevated = ["cliff", "platform", "building"].includes(C.launcher);
  const leftExtra = elevated ? Math.max(5, 0.15 * RANGE) : Math.max(2.5, 0.07 * RANGE);
  const gx0 = -leftExtra, gx1 = Math.max(RANGE, objMaxX) * 1.06 + 1;
  const gy0 = C.landing === "sea" ? -Math.max(1.5, 0.06 * H_TOP) : -0.5;
  const H_TOP2 = C.compare_theta != null ? H0 + Math.pow(C.v * Math.sin(C.compare_theta * Math.PI / 180), 2) / (2 * G) : 0;
  const gy1 = Math.max(H_TOP, H_TOP2, objMaxH, H0 + 2) * 1.12 + 0.5;
  // canvas height to suit the scene's shape (a long flat flight needs less height)
  H = cv.height = Math.round(Math.min(560, Math.max(320, (gy1 - gy0) / (gx1 - gx0) * (W - 2 * PAD) + 2 * PAD + 60)));

  function viewBox(){
    if (frame === "ground") return {x0: gx0, x1: gx1, y0: gy0, y1: gy1};
    if (frame === "vert"){                       // camera slides sideways with v_H
      const w = gx1 - gx0;
      return {x0: -0.3 * w, x1: 0.7 * w, y0: gy0, y1: gy1};
    }
    // camera rises and falls with the projectile, which stays at launch height
    return {x0: gx0, x1: gx1, y0: Math.min(gy0, H0 - H_TOP + gy0), y1: Math.max(gy1, H0 + objMaxH + 0.5)};
  }
  // how far the camera has moved (in the ground's coordinates) by time tt
  function shift(tt){
    if (frame === "vert") return [xAt(tt), 0];
    if (frame === "horiz") return [0, yAt(tt) - H0];
    return [0, 0];
  }
  let VB, S;
  function setView(){
    VB = viewBox();
    S = Math.min((W - 2 * PAD) / (VB.x1 - VB.x0), (H - 2 * PAD) / (VB.y1 - VB.y0));
  }
  // a point fixed to the ground → screen, as seen from the current frame now
  function P(xw, yw){
    const [dx, dy] = shift(t);
    return [PAD + (xw - dx - VB.x0) * S, H - PAD - (yw - dy - VB.y0) * S];
  }
  // a point already in the current frame's coordinates → screen
  function Pf(xf, yf){ return [PAD + (xf - VB.x0) * S, H - PAD - (yf - VB.y0) * S]; }

  const fmtNum = n => (+n).toFixed(Math.abs(n) >= 10 ? 1 : 2).replace(/\.?0+$/, "");
  // Labels are nudged upwards until they don't overlap one already drawn this frame.
  let placed = [];
  function label(text, x, y, color, align){
    ctx.font = "12px -apple-system,Segoe UI,Roboto,sans-serif";
    const w = ctx.measureText(text).width;
    // keep the label inside the canvas
    if (align === "right") x = Math.max(x, w + 4); else if (align === "center") x = Math.min(Math.max(x, w / 2 + 4), W - w / 2 - 4);
    else x = Math.min(Math.max(x, 4), W - w - 4);
    const x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
    const hit = yy => placed.some(r => x0 < r.x + r.w && x0 + w > r.x && yy - 12 < r.y && yy > r.y - 12);
    let tries = 0;
    while (hit(y) && tries++ < 12) y -= 14;
    placed.push({x: x0, y, w});
    ctx.fillStyle = color || "#e7ecf5"; ctx.textAlign = align || "left";
    ctx.fillText(text, x, y); ctx.textAlign = "left";
  }
  function niceStep(span){
    const raw = span / 8, p = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 5, 10]) if (m * p >= raw) return m * p;
    return 10 * p;
  }

  // Grid lines are fixed to the ground, so they visibly move in the moving frames.
  function drawGrid(){
    const [dx, dy] = shift(t);
    const step = niceStep(Math.max(VB.x1 - VB.x0, VB.y1 - VB.y0));
    ctx.lineWidth = 1; ctx.font = "11px ui-monospace,Menlo,monospace";
    for (let x = Math.ceil((VB.x0 + dx) / step) * step; x <= VB.x1 + dx; x += step){
      const [sx] = P(x, 0); ctx.strokeStyle = "#15253a";
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }
    for (let y = Math.ceil((VB.y0 + dy) / step) * step; y <= VB.y1 + dy; y += step){
      const [, sy] = P(0, y); ctx.strokeStyle = "#15253a";
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
    }
  }

  function fillPoly(pts, color){
    ctx.fillStyle = color; ctx.beginPath();
    pts.forEach((p, i) => { const [sx, sy] = P(...p); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
    ctx.closePath(); ctx.fill();
  }

  function drawTerrain(){
    const big = 1e4;
    const sea = C.landing === "sea";
    fillPoly([[-big, 0], [big, 0], [big, -big], [-big, -big]], sea ? "#1d4f7a" : "#2c3a24");
    ctx.strokeStyle = sea ? "#5fa8d8" : "#6b8a4a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(...P(-big, 0)); ctx.lineTo(...P(big, 0)); ctx.stroke();
    if (C.launcher === "cliff"){
      fillPoly([[-big, H0], [0, H0], [0.04 * H0, 0], [0.04 * H0, -big], [-big, -big]], "#5b5146");
      ctx.strokeStyle = "#6b8a4a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(...P(-big, H0)); ctx.lineTo(...P(0, H0)); ctx.stroke();
      const [lx, ly] = P(-leftExtra * 0.45, H0 * 0.5);
      label(`cliff ${fmtNum(H0)} m`, lx, ly, "#e9dfcf", "center");
    } else if (C.launcher === "platform" || C.launcher === "building"){
      const wdt = C.launcher === "building" ? 0.8 * leftExtra : 0.6 * leftExtra;
      fillPoly([[-wdt, H0], [0.2, H0], [0.2, 0], [-wdt, 0]], C.launcher === "building" ? "#4a5568" : "#6b5b45");
      if (C.launcher === "building"){
        const rows = Math.max(2, Math.floor(H0 / 3.5));
        for (let i = 0; i < 3; i++) for (let j = 0; j < rows; j++){
          const x = -wdt + (i + 0.3) * wdt / 3, y = H0 - (j + 0.3) * H0 / rows;
          fillPoly([[x, y], [x + 0.35 * wdt / 3, y], [x + 0.35 * wdt / 3, y - 0.35 * H0 / rows], [x, y - 0.35 * H0 / rows]], "#e6c36a66");
        }
      }
      const [lx, ly] = P(-wdt / 2, H0 / 2);
      label(`${C.launcher} ${fmtNum(H0)} m`, lx, ly, "#e7ecf5", "center");
    }
  }

  // Stick figure with feet at (xw, feetY) and a given height (m). If handY is
  // given, one arm reaches up to that height (a release point or a reach).
  function person(xw, feetY, heightM, handY, color, tag){
    const minPx = 34;                                  // keep figures visible when zoomed out
    const hPx = Math.max(heightM * S, minPx);
    const [fx, fy] = P(xw, feetY);
    const top = fy - hPx, headR = 0.11 * hPx;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(fx, top + headR, headR, 0, 2 * Math.PI); ctx.fill();
    const neck = top + 2 * headR, hip = fy - 0.47 * hPx, sh = neck + 0.05 * hPx;
    ctx.beginPath();
    ctx.moveTo(fx, neck); ctx.lineTo(fx, hip);
    ctx.moveTo(fx, hip); ctx.lineTo(fx - 0.14 * hPx, fy);
    ctx.moveTo(fx, hip); ctx.lineTo(fx + 0.14 * hPx, fy);
    ctx.moveTo(fx, sh); ctx.lineTo(fx - 0.18 * hPx, sh + 0.25 * hPx);
    if (handY != null){
      const [hx, hy] = P(xw + 0.15, handY);
      ctx.moveTo(fx, sh); ctx.lineTo(hx, Math.min(hy, sh));
    } else {
      ctx.moveTo(fx, sh); ctx.lineTo(fx + 0.18 * hPx, sh + 0.25 * hPx);
    }
    ctx.stroke();
    if (tag) label(tag, fx - 8, top - 4, color, "right");
  }

  function drawScene(){
    // the launcher
    if (C.launcher === "person") person(-0.3, 0, Math.max(1.4, H0 - 0.3), H0, "#9fd3ff", `release ${fmtNum(H0)} m`);
    else if (elevated) person(-1.0, H0, 1.7, null, "#9fd3ff", "");
    else person(-0.8, 0, 1.7, null, "#9fd3ff", "");

    for (const o of C.objects){
      if (o.type === "person"){
        person(o.x, 0, o.reach ? o.reach - 0.4 : 1.75, o.reach, "#c9b6ff", o.label || "");
        if (o.reach){
          const [ax, ay] = P(o.x - 1.5, o.reach), [bx] = P(o.x + 1.5, o.reach);
          ctx.setLineDash([5, 4]); ctx.strokeStyle = "#c9b6ff"; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, ay); ctx.stroke(); ctx.setLineDash([]);
          label(`reach ${fmtNum(o.reach)} m`, bx + 4, ay + 4, "#c9b6ff");
        }
      } else if (o.type === "crossbar"){
        const [px, py] = P(o.x, 0), [, ty] = P(o.x, o.height);
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, ty - 0.5 * S); ctx.stroke();
        ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(px - 9, ty); ctx.lineTo(px + 9, ty); ctx.stroke();
        label(`crossbar ${fmtNum(o.height)} m high, ${fmtNum(o.x)} m away`, px + 12, ty - 6, "#ffffff");
      } else if (o.type === "target"){
        const [px, py] = P(o.x, 0), [, cy] = P(o.x, o.height);
        ctx.strokeStyle = "#8a6a45"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, cy); ctx.stroke();
        const r = Math.max(9, 0.6 * S);
        for (const [k, col] of [[1, "#f4f0e6"], [0.75, "#222"], [0.5, "#3a7bd5"], [0.3, "#d33"], [0.12, "#f5c518"]]){
          ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, cy, r * k, 0, 2 * Math.PI); ctx.fill();
        }
        label(`target ${fmtNum(o.x)} m away`, px + r + 4, cy - r, "#ffffff");
      } else if (o.type === "flag"){
        const [px, py] = P(o.x, 0), [, ty] = P(o.x, 2.2);
        ctx.strokeStyle = "#ddd"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, ty); ctx.stroke();
        ctx.fillStyle = "#ff5a5a"; ctx.beginPath();
        ctx.moveTo(px, ty); ctx.lineTo(px + 14, ty + 6); ctx.lineTo(px, ty + 12); ctx.fill();
        label(`flag ${fmtNum(o.x)} m away`, px + 16, ty + 10, "#ffffff");
      }
    }
  }

  function drawPath(){
    if (!showPath) return;
    const curve = (vh, vv, tl, color, dash) => {
      ctx.setLineDash(dash); ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let i = 0; i <= 120; i++){
        const tt = tl * i / 120, [sx, sy] = P(vh * tt, H0 + vv * tt - 0.5 * G * tt * tt);
        i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
      }
      ctx.stroke(); ctx.setLineDash([]);
    };
    curve(VH, VV0, T_LAND, "#ffffff35", [4, 5]);
    if (C.compare_theta != null){
      const r2 = C.compare_theta * Math.PI / 180, vh2 = C.v * Math.cos(r2), vv2 = C.v * Math.sin(r2);
      const tl2 = (vv2 + Math.sqrt(vv2 * vv2 + 2 * G * H0)) / G;
      curve(vh2, vv2, tl2, "#c9b6ffaa", [2, 4]);
      const [lx, ly] = P(vh2 * tl2 * 0.5, H0 + vv2 * vv2 / (2 * G));
      label(`${C.compare_theta}° at the same speed`, lx + 6, ly - 6, "#c9b6ff");
    }
  }

  // The projectile's path so far as seen in this frame, plus equal-time dots.
  function drawTrail(){
    const pos = tt => frame === "vert" ? [0, yAt(tt)] : frame === "horiz" ? [xAt(tt), H0] : [xAt(tt), yAt(tt)];
    ctx.strokeStyle = frame === "horiz" ? "#2fd6c2" : frame === "vert" ? "#ffb020" : "#f4f0e6";
    ctx.lineWidth = 2; ctx.beginPath();
    const n = Math.max(2, Math.ceil(t / 0.02));
    for (let i = 0; i <= n; i++){
      const [sx, sy] = Pf(...pos(t * i / n)); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy);
    }
    ctx.stroke();
    if (showStrobe){
      ctx.fillStyle = "#ffffffaa";
      for (let tt = 0; tt <= t + 1e-9; tt += 0.2){
        const [sx, sy] = Pf(...pos(tt)); ctx.beginPath(); ctx.arc(sx, sy, 2.6, 0, 2 * Math.PI); ctx.fill();
      }
    }
  }

  function arrow(x, y, dx, dy, color, text){
    if (Math.hypot(dx, dy) < 2) return;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
    const a = Math.atan2(dy, dx);
    ctx.beginPath(); ctx.moveTo(x + dx, y + dy);
    ctx.lineTo(x + dx - 9 * Math.cos(a - 0.4), y + dy - 9 * Math.sin(a - 0.4));
    ctx.lineTo(x + dx - 9 * Math.cos(a + 0.4), y + dy - 9 * Math.sin(a + 0.4)); ctx.fill();
    if (text) label(text, x + dx + 5, y + dy + (dy > 0 ? 13 : -4), color);
  }

  function drawProjectile(){
    const [sx, sy] = P(xAt(t), yAt(t));
    if (showVec){
      // velocity relative to the current frame
      const k = Math.min(70 / Math.max(C.v, 1), 5);
      const vh = frame === "vert" ? 0 : VH, vv = frame === "horiz" ? 0 : vvAt(t);
      if (vh) arrow(sx, sy, vh * k, 0, "#2fd6c2", "v_H");
      if (Math.abs(vv) > 0.05) arrow(sx, sy, 0, -vv * k, "#ffb020", "v_V");
      if (vh && Math.abs(vv) > 0.05) arrow(sx, sy, vh * k, -vv * k, "#f4f0e680", "");
    }
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(sx, sy, 6, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = "#ffb020"; ctx.lineWidth = 2; ctx.stroke();
  }

  // Circles where the projectile is at each moment the question mentions.
  function drawMarks(){
    for (const m of [{t: T_UP, label: "highest point"}, ...C.marks]){
      if (m.t < 0 || m.t > T_LAND + 1e-6) continue;
      const [sx, sy] = frame === "vert" ? Pf(0, yAt(m.t)) : frame === "horiz" ? Pf(xAt(m.t), H0) : P(xAt(m.t), yAt(m.t));
      ctx.strokeStyle = "#ff6b5e"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sx, sy, 8, 0, 2 * Math.PI); ctx.stroke();
      label(m.label, sx + 10, sy - 10, "#ff9b91");
    }
  }

  function drawBadge(){
    let a, b;
    if (frame === "ground"){ a = "Camera fixed to the ground"; b = "both motions together"; }
    else if (frame === "horiz"){ a = "Camera moving up and down with the projectile"; b = "projectile only moves sideways"; }
    else { a = "Camera moving sideways at the projectile's v_H"; b = "projectile only moves up and down"; }
    ctx.fillStyle = "#0a1626dd"; ctx.fillRect(W - 300, 8, 292, 44);
    ctx.strokeStyle = "#24344a"; ctx.strokeRect(W - 300, 8, 292, 44);
    label(a, W - 290, 26, "#e7ecf5"); label(b, W - 290, 44, "#8a99b5");
  }

  const $ = id => document.getElementById(id);
  function render(){
    setView(); placed = [];
    ctx.fillStyle = "#0a1626"; ctx.fillRect(0, 0, W, H);
    drawGrid(); drawTerrain(); drawScene(); drawPath(); drawMarks(); drawTrail(); drawProjectile(); drawBadge();
    $("scrub").value = Math.round(1000 * t / T_LAND);
  }

  const notes = {
    ground: "Seen from the ground: the horizontal and vertical motions combine to give a curved path.",
    horiz: "The camera rises and falls with the projectile, so its vertical motion disappears: it moves sideways at a " +
           "constant v_H (equal distances in equal times) while the ground moves up and down.",
    vert: "The camera slides sideways at v_H, so the horizontal motion disappears: the projectile goes straight up, " +
          "stops at its highest point and falls back, exactly like an object fired straight upwards, while the ground slides past.",
  };
  function setFrame(f){
    frame = f;
    document.querySelectorAll(".fbtn").forEach(b => b.classList.toggle("active", b.dataset.frame === f));
    $("frameNote").textContent = notes[f];
    render();
  }
  function stop(){ playing = false; last = null; $("play").textContent = "▶ Play"; }
  function tick(now){
    if (!playing){ last = null; return; }
    if (last != null) t += (now - last) / 1000 * speed;
    last = now;
    if (t >= T_LAND){ t = T_LAND; stop(); }
    render();
    if (playing) requestAnimationFrame(tick);
  }
  $("play").onclick = () => {
    if (playing){ stop(); return; }
    if (t >= T_LAND - 1e-6) t = 0;
    playing = true; last = null; $("play").textContent = "❚❚ Pause"; requestAnimationFrame(tick);
  };
  $("reset").onclick = () => { stop(); t = 0; render(); };
  $("scrub").oninput = e => { stop(); t = T_LAND * e.target.value / 1000; render(); };
  $("speed").onchange = e => { speed = +e.target.value; };
  document.querySelectorAll(".fbtn").forEach(b => b.onclick = () => setFrame(b.dataset.frame));
  $("tStrobe").onchange = e => { showStrobe = e.target.checked; render(); };
  $("tVec").onchange = e => { showVec = e.target.checked; render(); };
  $("tPath").onchange = e => { showPath = e.target.checked; render(); };

  // jump-to buttons for the moments the question is about
  [{t: 0, label: "launch"}, {t: T_UP, label: "highest point"}, ...C.marks,
   {t: T_LAND, label: "lands on " + LEVEL.replace("the ", "")}]
    .filter(m => m.t >= 0 && m.t <= T_LAND + 1e-6)
    .sort((a, b) => a.t - b.t)
    .forEach(m => {
      const b = document.createElement("button");
      b.className = "jbtn"; b.textContent = m.label;
      b.onclick = () => { stop(); t = Math.min(m.t, T_LAND); render(); };
      $("jumps").appendChild(b);
    });

  setFrame("ground");
})();
</script>
</body>
</html>
